<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Card - Nikolay Tonchev</title>
    <style>
        body {
            background-color: #121214;
            color: #e2e2e2;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1a1c1e;
            width: 360px;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .close-btn {
            text-align: left;
            font-size: 24px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background-color: #7a4a00;
            color: white;
            font-size: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 15px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .contact-list {
            text-align: left;
        }

        .info-box {
            background-color: #111315;
            padding: 12px 16px;
            margin-bottom: 4px;
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .info-box:first-child { border-radius: 12px 12px 4px 4px; }
        .info-box:nth-last-child(2) { border-radius: 4px 4px 12px 12px; margin-bottom: 30px; }

        .val {
            display: block;
            font-size: 16px;
            margin-bottom: 2px;
        }

        .label {
            display: block;
            font-size: 12px;
            color: #9aa0a6;
        }

        /* Специален линк, изглеждащ като бутон */
        .save-btn {
            background-color: #b9d1ff;
            color: #041e49;
            text-decoration: none;
            padding: 14px;
            width: calc(100% - 28px);
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto;
            border: none;
            cursor: pointer;
        }

        .footer-info {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #9aa0a6;
            margin-bottom: 15px;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="close-btn">✕</div>
    
    <div class="avatar">N</div>
    <div class="profile-name">Nikolay Tonchev</div>

    <div class="contact-list">
        <div class="info-box">
            <span class="val">Nikolay Tonchev</span>
            <span class="label">Name</span>
        </div>

        <a href="tel:+359878294244" class="info-box">
            <span class="val">+359878294244</span>
            <span class="label">Phone · Home</span>
        </a>

        <a href="mailto:koul85@abv.bg" class="info-box">
            <span class="val">koul85@abv.bg</span>
            <span class="label">Email · Other</span>
        </a>

        <a href="https://maps.google.com/?q=ul.+Bulair+27,+Kardzhali" target="_blank" class="info-box">
            <span class="val">Kardzhali, ul. Bulair 27</span>
            <span class="label">Address · Home</span>
        </a>

        <a href="http://globalnet.bg" target="_blank" class="info-box">
            <span class="val">globalnet.bg</span>
            <span class="label">Website</span>
        </a>

        <div class="info-box">
            <span class="val">Global Net LTD.</span>
            <span class="label">Company</span>
        </div>
    </div>

    <div class="footer-info">
        Saving to device and Google 
        <span style="border: 1px solid #9aa0a6; border-radius: 50%; padding: 2px 5px; font-size: 10px;">G</span>
        <span>^</span>
    </div>

    <a id="vcardLink" class="save-btn">
        <span style="font-size: 20px;">👤+</span> Save contact
    </a>
</div>

<script>
    // Подготовка на данните във формат vCard
    const name = "Nikolay Tonchev";
    const phone = "+359878294244";
    const email = "koul85@abv.bg";
    const org = "Global Net LTD.";
    const adr = "ul. Bulair 27, Kardzhali, Bulgaria";
    const url = "http://globalnet.bg";

    const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${name}
ORG:${org}
TEL;TYPE=CELL,VOICE:${phone}
EMAIL;TYPE=PREF,INTERNET:${email}
ADR;TYPE=HOME:;;${adr};;;;
URL:${url}
END:VCARD`;

    // Кодиране на данните в Base64, за да се третират като директен линк, а не като файл
    const base64Vcard = btoa(unescape(encodeURIComponent(vcard)));
    const vcardUrl = 'data:text/vcard;base64,' + base64Vcard;

    // Задаване на линка към бутона
    document.getElementById('vcardLink').href = vcardUrl;
</script>

</body>
</html>
